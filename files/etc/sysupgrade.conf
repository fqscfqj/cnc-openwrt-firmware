## sysupgrade 升级时保留的文件与目录。
## 可以直接在 LuCI 的「系统 → 备份/刷写固件 → 配置」标签页里编辑本文件。
##
## 重要：/etc/config/ 下所有配置文件是由「包 conffiles」机制自动保留的
##       （apk 环境下 sysupgrade 读取 /lib/apk/packages/*.conffiles_static，
##        已核对 25.12 源码），所以不必在这里重复列出——包括：
##          /etc/config/network   ← 含 eth0=WAN、IPv6 设置、WireGuard 私钥与 peer
##          /etc/config/openclash、/etc/config/lucky、/etc/config/msd_lite、
##          /etc/config/vlmcsd、/etc/config/cnc_upgrade 等
##
## 下面列的是「不属于任何包 conffile 的插件数据目录」，与
## /lib/upgrade/keep.d/99-cnc-plugins 保持一致。
##
## 体积提示：配置备份会写到 64 MiB 的引导分区（p1）。OpenClash 的内核与规则集
## 也在 /etc/openclash 下，通常占用 10–30 MB，放得下；若以后规则集暴涨导致
## 备份过大，可把 /etc/openclash/core 从清单里去掉（Clash 内核可以重新下载）。

/etc/openclash/
/etc/lucky/
/etc/config/lucky.daji/
/etc/msd_lite/
