## sysupgrade 升级时保留的文件与目录。
## 可以直接在 LuCI 的「系统 → 备份/刷写固件 → 配置」标签页里编辑本文件。
##
## 重要：/etc/config/ 下所有配置文件是由「包 conffiles」机制自动保留的
##       （apk 环境下 sysupgrade 读取 /lib/apk/packages/*.conffiles_static，
##        已核对 25.12 源码），所以不必在这里重复列出——包括：
##          /etc/config/network   ← 含 eth0=WAN、IPv6 设置、WireGuard 私钥与 peer
##          /etc/config/openclash、/etc/config/lucky、/etc/config/msd_lite、
##          /etc/config/vlmcsd、/etc/config/cnc_upgrade 等
##
## 下面列的是「不属于任何包 conffile 的插件数据目录」，与
## /lib/upgrade/keep.d/99-cnc-plugins 保持一致（那份文件里有更详细的体检数据）。
##
## ★ 体积提示（2026-10 真机实测）★
## 配置备份会被写到 64 MiB 的引导分区（p1），而上游 platform_copy_config() 里那句
## `cp -af "$UPGRADE_BACKUP" /mnt/$BACKUP_FILE` **不检查返回值** —— 备份放不下时
## 升级会"成功"、重启后配置却是空的。实测：`sysupgrade -b` 出 43.6 MiB，
## p1 可用 57.7 MiB ⇒ 已用 75.6%。
## 所以「固件在线升级」页（cnc-upgrade）在刷写前会真量一次备份体积，超预算就拒绝刷写；
## 具体该精简哪一项、以及每一项的代价，见 /lib/upgrade/keep.d/99-cnc-plugins 的注释。
## ★不要**想当然地把 /etc/openclash/core 去掉**：OpenClash 补下内核要在冷启动、
## 代理还没起来的时候直连 GitHub，大陆网络常常拉不动，结果是"升级完 OpenClash 不启动"。

/etc/openclash/
/etc/lucky/
/etc/config/lucky.daji/
/etc/msd_lite/
